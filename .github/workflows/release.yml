name: Publish game release
on:
  push:
    tags: ['v1.0.0']
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run verify:all
      - run: zip -qr dao-den-long-v1.0.0.zip dist dist-sim game.contract.json package.json LICENSE CREDITS.md README.md
      - name: Publish verified build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dao-den-long-v1.0.0.zip docs/demo/demo.mp4 bench.json soak.json --verify-tag --title "Đảo Đèn Lồng v1.0.0" --notes "Giải nén gói ZIP và chạy node dist-sim/launcher.js với Node.js 20."
